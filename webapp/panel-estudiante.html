<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis actividades — Apoyos Educativos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar encabezado shadow-sm" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Apoyos Educativos</span>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="text-white" id="encabezado-saludo"></span>
        <button type="button" class="btn btn-outline-light btn-sm" id="btn-cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="h4 mb-4">Mis actividades</h1>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <p id="cargando" class="text-body-secondary">Cargando actividades…</p>

    <p id="vacio" class="text-body-secondary d-none">
      Todavía no tenés actividades asignadas.
    </p>

    <!-- Una sección por clase, con sus tarjetas (panel-estudiante.js). -->
    <div id="lista-actividades"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/encabezado.js"></script>
  <script src="js/clases.js"></script>
  <script src="js/panel-estudiante.js"></script>
</body>
</html>
