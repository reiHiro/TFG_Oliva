<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis clases — Apoyos Educativos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar encabezado shadow-sm" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Apoyos Educativos</span>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="text-white" id="encabezado-saludo"></span>
        <button type="button" class="btn btn-outline-light btn-sm" id="btn-cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <!-- Clases (HU-014): solo agrupan actividades; no tienen estudiantes miembros.
       Las actividades de cada clase están en clase.html?id=N.
       Editar y dar de baja (HU-015): la baja es lógica y reversible. -->
  <main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <!-- tabindex="-1": el foco viene acá al cambiar entre activas y dadas de baja. -->
      <h1 class="h4 mb-0" id="titulo-pagina" tabindex="-1">Mis clases</h1>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary" id="btn-ver-bajas">Ver clases dadas de baja</button>
        <button type="button" class="btn btn-primary" id="btn-crear-clase">Crear clase</button>
      </div>
    </div>

    <div id="alerta" class="alert d-none" role="alert"></div>
    <!-- Avisos de éxito: quedan fuera de los modales porque los modales se cierran. -->
    <div id="mensaje-panel" role="status" aria-live="polite"></div>

    <p id="cargando" class="text-body-secondary">Cargando clases…</p>

    <p id="vacio" class="text-body-secondary d-none"></p>

    <ul id="lista-clases" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 list-unstyled d-none"
        aria-labelledby="titulo-pagina"></ul>
  </main>

  <!-- Modal para crear o editar una clase -->
  <div class="modal fade" id="modal-clase" tabindex="-1" aria-labelledby="modal-clase-titulo" aria-hidden="true">
    <div class="modal-dialog">
      <form id="form-clase" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="modal-clase-titulo">Crear clase</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="mensaje-clase" role="status" aria-live="polite"></div>

          <div class="mb-3">
            <label for="clase-nombre" class="form-label">Nombre <span aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="clase-nombre" name="nombre" maxlength="100"
                   placeholder="Por ejemplo: 5.º A" required aria-required="true"
                   aria-describedby="clase-nombre-error">
            <div class="invalid-feedback" id="clase-nombre-error"></div>
          </div>

          <div class="mb-3">
            <label for="clase-descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="clase-descripcion" name="descripcion" rows="2" maxlength="500"
                      placeholder="Por ejemplo: Ciencias naturales, turno mañana"
                      aria-describedby="clase-descripcion-error"></textarea>
            <div class="invalid-feedback" id="clase-descripcion-error"></div>
          </div>

          <div class="mb-2">
            <label for="clase-materia" class="form-label">Materia</label>
            <input type="text" class="form-control" id="clase-materia" name="materia" maxlength="100"
                   placeholder="Por ejemplo: Biología" aria-describedby="clase-materia-error">
            <div class="invalid-feedback" id="clase-materia-error"></div>
          </div>

          <p class="form-text mb-0">* Obligatorio</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-guardar-clase">Crear clase</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para confirmar la baja de una clase -->
  <div class="modal fade" id="modal-baja" tabindex="-1" aria-labelledby="modal-baja-titulo"
       aria-describedby="modal-baja-texto" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modal-baja-titulo">Dar de baja la clase</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="mensaje-baja" role="status" aria-live="polite"></div>
          <p class="mb-0" id="modal-baja-texto"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="btn-cancelar-baja">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btn-confirmar-baja">Dar de baja</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/encabezado.js"></script>
  <script src="js/clases.js"></script>
  <script src="js/panel-docente.js"></script>
</body>
</html>
