<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — Apoyos Educativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="pagina-acceso">
  <main class="acceso">
    <div class="acceso-ilustracion">
      <img src="img/estudiando.svg" alt="">
    </div>

    <div class="acceso-formulario">
      <div class="acceso-contenido">
        <h1 class="acceso-titulo">Crear cuenta</h1>
        <p class="acceso-subtitulo">Completá tus datos para registrarte.</p>

        <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-registro" novalidate>
          <div class="row g-4 mb-4">
            <div class="col-sm-6">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100" required autocomplete="given-name">
              <div class="invalid-feedback" data-campo="nombre"></div>
            </div>
            <div class="col-sm-6">
              <label for="apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="apellido" name="apellido" maxlength="100" required autocomplete="family-name">
              <div class="invalid-feedback" data-campo="apellido"></div>
            </div>
          </div>
          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="255" required autocomplete="email">
            <div class="invalid-feedback" data-campo="email"></div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" minlength="8" required autocomplete="new-password">
            <div class="form-text">Mínimo 8 caracteres.</div>
            <div class="invalid-feedback" data-campo="password"></div>
          </div>
          <div class="mb-4">
            <label for="rol" class="form-label">Rol</label>
            <select class="form-select" id="rol" name="rol" required>
              <option value="" selected disabled>Elegí un rol</option>
              <option value="estudiante">Estudiante</option>
              <option value="docente">Docente</option>
            </select>
            <div class="invalid-feedback" data-campo="rol"></div>
          </div>
          <button type="submit" class="btn btn-acceso" id="btn-enviar">Registrarme</button>
        </form>

        <p class="acceso-cruzado">
          ¿Ya tenés cuenta? <a href="index.html">Iniciá sesión</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
