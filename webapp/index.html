<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Apoyos Educativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="pagina-acceso">
  <main class="acceso">
    <div class="acceso-ilustracion">
      <img src="img/estudiando.svg" alt="">
    </div>

    <div class="acceso-formulario">
      <div class="acceso-contenido">
        <h1 class="acceso-titulo">Iniciar sesión</h1>
        <p class="acceso-subtitulo">Ingresá con tu cuenta para continuar.</p>

        <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-login" novalidate>
          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-acceso" id="btn-enviar">Ingresar</button>
        </form>

        <p class="acceso-cruzado">
          ¿No tenés cuenta? <a href="registro.html">Registrate</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Transición de bienvenida: se muestra solo tras un login exitoso. -->
  <div id="bienvenida" class="bienvenida" role="status" hidden>
    <p class="bienvenida-texto" id="bienvenida-texto"></p>
    <div class="bienvenida-barras" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
